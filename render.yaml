# Render Blueprint. Create the service with this file, then fill in the secrets
# marked sync: false in the dashboard — they are never committed.
#
# No disk is attached on purpose: every piece of state lives in Turso, so an
# instance can be replaced without losing invites or read history.

services:
  - type: web
    name: gh-star-reader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Reachable by anyone who finds the URL, so the invite is required here
      # regardless of how NODE_ENV is interpreted.
      - key: INVITE_REQUIRED
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      # Not optional in practice: unauthenticated GitHub allows 60 requests an
      # hour and one summary spends around twenty of them.
      - key: GITHUB_TOKEN
        sync: false
      # Lets `npm run invite` mint links against this instance.
      - key: ADMIN_TOKEN
        sync: false
