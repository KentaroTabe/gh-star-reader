# fly launch --no-deploy がこのファイルを上書きすることがあります。
# app 名だけ自分のものに変えて、あとはそのまま使えます。

app = "gh-star-reader"
primary_region = "nrt"

[build]

[env]
  DATA_DIR = "/data"
  # Deployed means reachable by anyone who guesses the URL, so the invite is
  # required here regardless of NODE_ENV.
  INVITE_REQUIRED = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero would let the machine stop between visitors; one keeps the shelf quick
  # for a handful of people without paying for a second machine.
  min_machines_running = 1

[[mounts]]
  source = "gh_star_reader_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
